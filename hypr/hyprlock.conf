# Nocturne lock screen: the clock is the screen, over your wallpaper.
# Open windows are never shown here. The password dots appear when you type.

source = ~/.config/hypr/palette.conf

# The wallpaper chosen with SUPER + ALT + W, and how much to dim it: darker
# wallpapers are dimmed less. hypr/scripts/wallpaper writes the sourced file
# outside the repo; these two lines are the fallback before that exists.
$wallpaper = $HOME/.config/hypr/wallpapers/nocturne.jpg
$lock_brightness = 0.95
source = ~/.local/state/nocturne/hyprlock.conf

general {
    hide_cursor = true
    ignore_empty_input = true
    fractional_scaling = 1
}

auth {
    fingerprint {
        enabled = false
    }
}

animations {
    enabled = true
    bezier = settle, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 2, settle
    animation = fadeOut, 1, 1.5, settle
    animation = inputFieldDots, 1, 1.2, settle
}

background {
    monitor =
    path = $wallpaper
    color = $ink_0
    # Heavily blurred and darkened: the wallpaper becomes a soft field of its
    # colours, and the clock reads cleanly over it.
    blur_passes = 4
    blur_size = 14
    brightness = $lock_brightness
    contrast = 0.9
    vibrancy = 0.2
    noise = 0.012
}

# Date, small capitals above the clock
label {
    monitor =
    text = cmd[update:60000] echo "<span letter_spacing='3000'>$(date +'%^a %-d %^b')</span>"
    color = $text
    font_size = 16
    font_family = Lilex Nerd Font Medium
    # Positions are in physical pixels (twice the logical size at scale 2).
    position = 0, 184
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(080b14cc)
}

# Clock: font_size is in logical pixels, so 200 gives digits about 104 px tall.
label {
    monitor =
    text = $TIME
    color = $bright
    font_size = 200
    font_family = IBM Plex Sans Light
    position = 0, 30
    halign = center
    valign = center
    # A soft dark shadow, not a glow: keeps the digits readable over any
    # wallpaper, including bright lines running behind them.
    shadow_passes = 3
    shadow_size = 10
    shadow_color = rgba(080b14cc)
}

# Password: no box, just dots in the accent colour
input-field {
    monitor =
    size = 300, 48
    outline_thickness = 0
    outer_color = rgba(00000000)
    inner_color = rgba(00000000)
    font_color = $accent
    check_color = $gold
    fail_color = $red
    capslock_color = $gold
    dots_size = 0.2
    dots_spacing = 0.7
    dots_center = true
    dots_rounding = -1
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text =
    fail_text = <span font_family="IBM Plex Sans">$FAIL</span>
    hide_input = false
    rounding = 6
    position = 0, -190
    halign = center
    valign = center
}

# Battery and connection
label {
    monitor =
    text = cmd[update:30000] ~/.config/hypr/scripts/lock_status
    color = $text
    font_size = 15
    font_family = Lilex Nerd Font
    position = 0, 48
    halign = center
    valign = bottom
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(080b14cc)
}
