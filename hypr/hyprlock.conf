$surface = rgba(0f1937dd)
$surface_soft = rgba(16264ecc)
$accent = rgb(9ccfd8)
$accent_blue = rgb(4090ff)
$text = rgb(e0def4)
$warm = rgb(ff5d4d)

auth {
    fingerprint {
        enabled = false
    }
}

general {
    fractional_scaling = 1
}

background {
    monitor =
    path = $HOME/.config/hypr/wallpapers/Cloudsnight.jpg
    # color = $color1

    # all these options are taken from hyprland, see https://wiki.hyprland.org/Configuring/Variables/#blur for explanations
    blur_size = 4
    blur_passes = 3 # 0 disables blurring
    noise = 0.0117
    contrast = 1.3000 # Vibrant!!!
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 400, 50
    outline_thickness = 3
    dots_size = 0.26 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.64 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(4090ff99) rgba(ff5d4d99) 45deg
    inner_color = $surface
    font_color = $accent
    check_color = rgba(4090ffbb) rgba(9ccfd8bb) 45deg
    fail_color = rgba(ff5d4dbb) rgba(f38ba8bb) 45deg
    fade_on_empty = true
    placeholder_text = <i>Password...</i> # Text rendered in the input box when it's empty.
    hide_input = false
    rounding = 14

    position = 0, 150
    halign = center
    valign = bottom
}

# Current time
label {
    monitor =
    text = cmd[update:1000] date +"<b><big> %H:%M:%S </big></b>"
    color = $accent
    font_size = 64
    font_family = FiraCode Nerd Font
    shadow_passes = 3
    shadow_size = 4

    position = 0, 30
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"<b>%A, %-d %B %Y</b>"
    color = $text
    font_size = 24
    font_family = Inter Display Medium

    position = 0, -30
    halign = center
    valign = center
}

label {
    monitor =
    text = Hey $USER
    color = $text
    font_size = 18
    font_family = Inter Display Medium

    position = 0, 30
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:30000] $HOME/.config/hypr/scripts/lock_status
    color = $text
    font_size = 16
    font_family = FiraCode Nerd Font

    position = 0, 68
    halign = center
    valign = bottom
}
