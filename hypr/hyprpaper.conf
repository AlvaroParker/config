# Fallback for running hyprpaper by hand. At login, hypr/scripts/wallpaper starts
# hyprpaper with the wallpaper chosen in the launcher (SUPER + ALT + W), which is
# remembered in ~/.local/state/nocturne rather than in this repo.
splash = false
ipc = true

wallpaper {
    monitor =
    path = ~/.config/hypr/wallpapers/nocturne.jpg
    fit_mode = cover
}
