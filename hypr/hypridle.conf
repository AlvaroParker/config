general {
    lock_cmd = pidof hyprlock || hyprlock                   # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session                # lock before suspend.
    after_sleep_cmd = ~/.config/hypr/scripts/hypr-dpms on   # turn displays back on after suspend.
}

# Dim 30 seconds before locking, so the lock never comes as a surprise.
listener {
    timeout = 270                                           # 4.5 min
    on-timeout = ~/.config/hypr/scripts/dim on
    on-resume = ~/.config/hypr/scripts/dim off
}

listener {
    timeout = 300                                           # 5 min
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330                                           # 5.5 min
    on-timeout = ~/.config/hypr/scripts/hypr-dpms off
    on-resume = ~/.config/hypr/scripts/hypr-dpms on
}

# Sleep, and hibernate after two hours asleep on battery
# (system/etc/systemd/sleep.conf.d/hibernate.conf).
listener {
    timeout = 1800                                          # 30 min
    on-timeout = systemctl suspend-then-hibernate
}
