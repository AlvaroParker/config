# reviewr only offers named themes, so Nocturne cannot be generated for it.
# Rosé Pine is the closest: a cold dark base with a rose accent.
theme = "rose-pine"
default_scope = "last-turn"
diff_view = "unified"
toggle_placement = "overlay"
auto_open = false
# Zed stays the code editor here; $EDITOR (nvim) is left alone for terminal edits.
editor = "zed {file}:{line}"
