# Power settings for this ThinkPad. See system/README.md, "Power and battery".
#
# TLP reads /etc/tlp.d/*.conf first and /etc/tlp.conf last, and the last value
# wins, so keep these settings out of /etc/tlp.conf.
#
# TLP picks the performance profile on the charger and the balanced profile on
# battery. The launcher's power menu and the control centre's performance
# switch pick another one by hand (tlpctl).

# Performance profile, on the charger: as fast as the machine goes
CPU_SCALING_GOVERNOR_ON_PRF=performance
CPU_ENERGY_PERF_POLICY_ON_PRF=performance
CPU_BOOST_ON_PRF=1
CPU_HWP_DYN_BOOST_ON_PRF=1
PLATFORM_PROFILE_ON_PRF=performance

# Balanced profile, on battery: set for battery life, the same as power-saver
CPU_SCALING_GOVERNOR_ON_BAL=powersave
CPU_ENERGY_PERF_POLICY_ON_BAL=power
CPU_BOOST_ON_BAL=0
CPU_HWP_DYN_BOOST_ON_BAL=0
PLATFORM_PROFILE_ON_BAL=low-power

# Power-saver profile
CPU_SCALING_GOVERNOR_ON_SAV=powersave
CPU_ENERGY_PERF_POLICY_ON_SAV=power
CPU_BOOST_ON_SAV=0
CPU_HWP_DYN_BOOST_ON_SAV=0
PLATFORM_PROFILE_ON_SAV=low-power

# Wi-Fi power saving off in every profile. TLP would turn it on in balanced
# and power-saver, against etc/NetworkManager/conf.d/wifi-powersave.conf,
# which turns it off on every connection.
WIFI_PWR_ON_PRF=off
WIFI_PWR_ON_BAL=off
WIFI_PWR_ON_SAV=off

# Battery care: start charging only below 80%, and stop at 90%
START_CHARGE_THRESH_BAT0=80
STOP_CHARGE_THRESH_BAT0=90
