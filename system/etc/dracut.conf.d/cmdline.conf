# Kernel command line baked into the unified kernel image.
# The three <PLACEHOLDERS> are specific to each machine and are kept out of
# this repo; see system/README.md for how to find them.
kernel_cmdline="rd.luks.uuid=luks-<LUKS_UUID> rd.lvm.lv=vg/root root=/dev/mapper/vg-root rootfstype=ext4 rootflags=rw,relatime snd_hda_intel.dmic_detect=0 splash quiet plymouth.nolog resume=UUID=<SWAP_UUID> resume_offset=<SWAP_OFFSET> thinkpad_acpi.fan_control=1 thinkpad_acpi.experimental=1 i915.force_probe=!7d55 xe.force_probe=7d55"
