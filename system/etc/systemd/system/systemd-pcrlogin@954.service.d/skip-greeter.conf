# 954 is the greeter user on this machine (id -u greeter).
#
# systemd measures each user's record into the TPM on their first login of a
# boot. For the greeter that took about 1.7 seconds on every boot, and the
# login screen could not start until it was done. The greeter is a login
# screen, not a person, and no "login" NvPCR is set up on this machine, so
# the measurement ended in "skipping gracefully" anyway.
#
# Real users are still measured. Remove this file to measure the greeter too.
[Service]
ExecStart=
ExecStart=/usr/bin/true
