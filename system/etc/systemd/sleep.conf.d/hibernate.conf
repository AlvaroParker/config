# Sleep, then hibernate: after two hours asleep on battery the laptop
# hibernates, so a forgotten sleep never drains it flat. On the charger it
# stays asleep, ready in a second. Used by `systemctl suspend-then-hibernate`,
# which the lid, the idle timer and the power menu's Sleep all run.
[Sleep]
HibernateDelaySec=2h
HibernateOnACPower=no
