# Generated by nocturne/build from nocturne/palette.toml. Edit that file, not this one.
# hyprtoolkit: Hyprland's own toolkit, which draws the screen-share picker
# (xdg-desktop-portal-hyprland), hyprshutdown, hyprland-dialog and
# hyprland-run. Each reads this file when it starts.
#
# The window on ink-1, rows, tabs and buttons on ink-2 with an ink-3 edge.
# The accent marks the chosen tab and the main button; hyprtoolkit picks the
# dark text on it by itself.

background = rgb({{ink-1:hex}})
base = rgb({{ink-2:hex}})
alternate_base = rgb({{ink-3:hex}})
text = rgb({{text:hex}})
bright_text = rgb({{bright:hex}})
link_text = rgb({{blue:hex}})
accent = rgb({{accent:hex}})
accent_secondary = rgb({{accent-bright:hex}})

font_family = IBM Plex Sans
font_family_monospace = Lilex Nerd Font

# Corners as everywhere else: 10 px for windows and cards, 6 px for rows and
# buttons.
rounding_large = 10
rounding_small = 6
