# Generated by nocturne/build from nocturne/palette.toml. Edit that file, not this one.
# Status line, borders and menus. Sourced at the end of tmux.conf.

set -g status-style "bg={{ink-1}},fg={{faint}}"
set -g status-justify left
set -g status-left-length 32
set -g status-left "#[fg={{muted}},bold]#S#[default]   "
set -g status-right-length 40
set -g status-right "#{?pane_in_mode,#[fg={{gold}}]copy  ,}#{?client_prefix,#[fg={{gold}}]prefix  ,}"

set -g window-status-style default
set -g window-status-current-style default
set -g window-status-last-style default
set -g window-status-separator "   "
set -g window-status-format "#I #W"
set -g window-status-current-format "#[fg={{accent}}]●#[fg={{bright}}] #I #W"
set -g window-status-activity-style "fg={{gold}}"
set -g window-status-bell-style "fg={{red}}"

set -g pane-border-lines single
set -g pane-border-style "fg={{line}}"
set -g pane-active-border-style "fg={{accent}}"
set -g display-panes-colour "{{faint}}"
set -g display-panes-active-colour "{{accent}}"

set -g message-style "bg={{ink-2}},fg={{text}}"
set -g message-command-style "bg={{ink-2}},fg={{text}}"
set -g mode-style "bg={{accent-dim}},fg={{bright}}"
set -g copy-mode-match-style "bg={{accent-dim}},fg={{bright}}"
set -g copy-mode-current-match-style "bg={{accent}},fg={{ink-1}}"
set -g clock-mode-colour "{{accent}}"

set -g popup-border-style "fg={{line}}"
set -g menu-style "bg={{ink-2}},fg={{text}}"
set -g menu-selected-style "bg={{ink-3}},fg={{bright}}"
set -g menu-border-style "fg={{line}}"
