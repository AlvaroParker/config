# Generated by nocturne/build from nocturne/palette.toml. Edit that file, not this one.
# mpv's on-screen controls: one bar along the bottom on the deepest ink,
# shown while the mouse moves. The accent marks where you are: the played
# part of the seek bar and the time. Everything else is text or quieter.

layout=bottombar
background_color={{ink-0}}
boxalpha=60
hidetimeout=800
fadeduration=120

timecode_color={{accent}}
time_pos_color={{bright}}
time_pos_outline_color={{ink-0}}
title_color={{text}}
buttons_color={{text}}
small_buttonsL_color={{muted}}
small_buttonsR_color={{muted}}
top_buttons_color={{muted}}
held_element_color={{faint}}
