# Generated by nocturne/build from nocturne/palette.toml. Edit that file, not this one.
# Status line, borders and menus. Sourced at the end of tmux.conf.

set -g status-style "bg=#0f121e,fg=#80879d"
set -g status-justify left
set -g status-left-length 32
set -g status-left "#[fg=#a1a7bb,bold]#S#[default]   "
set -g status-right-length 40
set -g status-right "#{?pane_in_mode,#[fg=#f2c36a]copy  ,}#{?client_prefix,#[fg=#f2c36a]prefix  ,}"

set -g window-status-style default
set -g window-status-current-style default
set -g window-status-last-style default
set -g window-status-separator "   "
set -g window-status-format "#I #W"
set -g window-status-current-format "#[fg=#f4a4ad]●#[fg=#f3f5fc] #I #W"
set -g window-status-activity-style "fg=#f2c36a"
set -g window-status-bell-style "fg=#fc5950"

set -g pane-border-lines single
set -g pane-border-style "fg=#30364a"
set -g pane-active-border-style "fg=#f4a4ad"
set -g display-panes-colour "#80879d"
set -g display-panes-active-colour "#f4a4ad"

set -g message-style "bg=#171b2a,fg=#d9deec"
set -g message-command-style "bg=#171b2a,fg=#d9deec"
set -g mode-style "bg=#522a30,fg=#f3f5fc"
set -g copy-mode-match-style "bg=#522a30,fg=#f3f5fc"
set -g copy-mode-current-match-style "bg=#f4a4ad,fg=#0f121e"
set -g clock-mode-colour "#f4a4ad"

set -g popup-border-style "fg=#30364a"
set -g menu-style "bg=#171b2a,fg=#d9deec"
set -g menu-selected-style "bg=#222739,fg=#f3f5fc"
set -g menu-border-style "fg=#30364a"
