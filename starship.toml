"$schema" = "https://starship.rs/config-schema.json"

# Nocturne prompt. Line one: where you are, the branch and what changed, with
# the project's languages pushed to the right. Line two: the mark, which turns
# red after a failed command. Nothing else appears until it matters.
palette = "nocturne"
add_newline = true
format = """
$directory$git_branch$git_state$git_status$fill\
$nodejs$bun$python$rust$golang$ruby$dotnet$java$php$terraform$cmd_duration
$character"""

[character]
success_symbol = "[❯](accent)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](muted)"
vimcmd_visual_symbol = "[❮](gold)"
vimcmd_replace_symbol = "[❮](gold)"
vimcmd_replace_one_symbol = "[❮](gold)"

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bright"
read_only = " 󰌾"
read_only_style = "gold"
truncate_to_repo = false
truncation_length = 4
truncation_symbol = "…/"

[git_branch]
format = "[$branch]($style) "
style = "muted"

[git_state]
format = "[$state( $progress_current/$progress_total)]($style) "
style = "gold"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "muted"
conflicted = "[=$count](red) "
modified = "[●$count](gold) "
staged = "[+$count](green) "
renamed = "[»$count](gold) "
deleted = "[−$count](red) "
untracked = "[?$count](faint) "
stashed = "[≡](faint) "
ahead = "[↑$count](foam)"
behind = "[↓$count](foam)"
diverged = "[↑$ahead_count↓$behind_count](foam)"

[fill]
symbol = " "

[cmd_duration]
min_time = 2000
format = "[$duration]($style) "
style = "faint"

# Languages: quiet, right-aligned, shown only inside a project that uses them.
[nodejs]
format = "[$symbol($version )]($style)"
symbol = " "
style = "faint"
version_format = "${major}"

[bun]
format = "[$symbol($version )]($style)"
symbol = " "
style = "faint"
version_format = "${major}.${minor}"

[python]
format = "[$symbol($version )(\\($virtualenv\\) )]($style)"
symbol = " "
style = "faint"
version_format = "${major}.${minor}"

[rust]
format = "[$symbol($version )]($style)"
symbol = "󱘗 "
style = "faint"
version_format = "${major}.${minor}"

[golang]
format = "[$symbol($version )]($style)"
symbol = " "
style = "faint"
version_format = "${major}.${minor}"

[ruby]
format = "[$symbol($version )]($style)"
symbol = " "
style = "faint"
version_format = "${major}.${minor}"

[dotnet]
format = "[$symbol($version )]($style)"
symbol = "󰪮 "
style = "faint"
version_format = "${major}"

[java]
format = "[$symbol($version )]($style)"
symbol = " "
style = "faint"
version_format = "${major}"

[php]
format = "[$symbol($version )]($style)"
symbol = " "
style = "faint"
version_format = "${major}.${minor}"

[terraform]
format = "[$symbol($version )]($style)"
symbol = "󱁢 "
style = "faint"
version_format = "${major}.${minor}"

# >>> nocturne palette (generated by nocturne/build)
[palettes.nocturne]
faint = "#80879d"
muted = "#a1a7bb"
text = "#d9deec"
bright = "#f3f5fc"
accent = "#f4a4ad"
red = "#fc5950"
gold = "#f2c36a"
green = "#7dd89f"
foam = "#8bd6de"
# <<< nocturne palette
