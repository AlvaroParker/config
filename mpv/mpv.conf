# mpv: plays the screen recordings, and anything else. Colours come from the
# block at the end and from script-opts/ (the on-screen controls and menus),
# all written by nocturne/build.

# Video through the GPU: libplacebo's output, and hardware decoding, which
# plays the AV1 recordings on the Intel GPU without busying the CPU.
vo=gpu-next
hwdec=auto-safe

# Pick up where you stopped. Only the position is remembered, in
# ~/.local/state/mpv; volume and tracks start fresh each time.
save-position-on-quit=yes
watch-later-options=start

# Stay on the last frame instead of closing, so a short clip can be looked at.
keep-open=yes

# A new window is never larger than 80% of the screen.
autofit-larger=80%x80%

# Behind the picture: the deepest ink, never a checkerboard, so a window
# screenshot's rounded corners sit on the desktop's own dark.
background=color

# Quiet text: IBM Plex Sans, smaller than mpv's default, a thin outline.
osd-font="IBM Plex Sans"
osd-font-size=24
osd-outline-size=1.2
osd-bar-w=50
osd-bar-h=2

# Screenshots (s) go where the desktop's do.
screenshot-dir=~/Pictures/Screenshots
screenshot-template="mpv-%F-%wH.%wM.%wS"
screenshot-format=png

# >>> nocturne palette
# Generated by nocturne/build from nocturne/palette.toml. Edit that file, not this one.
osd-color="#d9deec"
osd-outline-color="#080b14"
background-color="#080b14"
# <<< nocturne palette
