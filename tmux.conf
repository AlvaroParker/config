# Terminal and SSH behavior
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set-option -sa terminal-overrides ",xterm*:Tc"
set -g set-clipboard external
set -g focus-events on
set -g update-environment "DISPLAY KRB5CCNAME SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION SSH_TTY XAUTHORITY"
set -g set-titles on
# The bar shows this after the app name: the folder, then the command.
set -g set-titles-string "#{b:pane_current_path} · #W"

# General behavior
set -g prefix C-b
set -g mouse on
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -s escape-time 10

# Preserve modified keys such as Shift+Enter
set -s extended-keys on
set -s extended-keys-format csi-u

# Tell tmux that the outer terminal supports extended keys
set -as terminal-features 'xterm*:extkeys'

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g allow-rename off

# Vim-style copy mode
setw -g mode-keys vi

# Reload the configuration
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Session management from the current pane directory
bind m attach-session -c "#{pane_current_path}"
bind a new-session -c "#{pane_current_path}"

# Create windows and panes in the current pane directory
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Repeatable pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vim-style selection and native terminal clipboard forwarding
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Status line at the top, styled by Nocturne: session, then windows, with the
# accent dot on the current one. The clock lives in the bar, not here.
set -g status-position top
source-file ~/.config/nocturne/tmux.conf

# Plugins managed by TPM
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Keep TPM initialization at the very bottom of this file.
run '~/.tmux/plugins/tpm/tpm'
