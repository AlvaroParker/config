# Terminal and SSH behavior
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set-option -sa terminal-overrides ",xterm*:Tc"
set -g set-clipboard external
set -g focus-events on
set -g update-environment "DISPLAY KRB5CCNAME SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION SSH_TTY XAUTHORITY"
set -g set-titles on
set -g set-titles-string "#h:#S:#I:#W"

# General behavior
set -g prefix C-b
set -g mouse on
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -s escape-time 10

# Preserve modified keys such as Shift+Enter
set -s extended-keys on
set -s extended-keys-format csi-u

# Tell tmux that the outer terminal supports extended keys
set -as terminal-features 'xterm*:extkeys'

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g allow-rename off

# Vim-style copy mode
setw -g mode-keys vi

# Reload the configuration
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Session management from the current pane directory
bind m attach-session -c "#{pane_current_path}"
bind a new-session -c "#{pane_current_path}"

# Create windows and panes in the current pane directory
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Repeatable pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vim-style selection and native terminal clipboard forwarding
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Plugins managed by TPM
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-battery'

# Catppuccin theme
set -g @catppuccin_flavor 'mocha' # latte, frappe, macchiato or mocha
set -g @catppuccin_window_status_style "custom"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_left_separator "#[bg=default,fg=#{@thm_surface_0}]#[bg=#{@thm_surface_0},fg=#{@thm_fg}]"
set -g @catppuccin_window_right_separator "#[bg=default,fg=##9399B2]"
set -g @catppuccin_window_current_left_separator "#[bg=default,fg=#{@thm_surface_1}]#[bg=#{@thm_mauve},fg=#{@thm_bg}]"
set -g @catppuccin_window_current_right_separator "#[bg=default,fg=#{@thm_mauve}]"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text " #W"

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

set -g status-left ""
set -g status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
set -g status-position top

# Keep TPM initialization at the very bottom of this file.
run '~/.tmux/plugins/tpm/tpm'
